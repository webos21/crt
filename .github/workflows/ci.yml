name: CI

on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "porting/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "porting/**"
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            runner: macos-latest
            preset: macos-host-ninja-debug
          - name: linux-amd64
            runner: ubuntu-latest
            preset: linux-host-ninja-debug
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            preset: linux-host-ninja-debug
          - name: windows-x64
            runner: windows-latest
            preset: windows-host-ninja-debug
            msvc_arch: x64
            llvm_asset: win64
          - name: windows-arm64
            runner: windows-11-arm
            preset: windows-host-ninja-debug
            msvc_arch: arm64
            llvm_asset: woa64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # ---- Linux: apt already carries a native clang/lld for both amd64
      # and arm64 repos, so the same step works for both matrix legs.
      # libc++-dev/libc++abi-dev are required from here on: CMakeLists.txt
      # forces -stdlib=libc++ for CRT_TARGET_OS=linux (see its own comment)
      # so CMake's one-time CXX-compiler-ABI-detection step links a trivial
      # program with -stdlib=libc++ before this project's own freestanding
      # flags ever apply -- without the dev package, that trivial link
      # itself fails outright ("cannot find -lc++"), not a graceful
      # fallback to GNU libstdc++ as an earlier comment in CMakeLists.txt
      # assumed. Confirmed for real: bare `clang lld ninja-build cmake`
      # (this step's previous package list) reproduces the exact failure
      # on both Clang 10 and Clang 18 on Ubuntu; CI's own linux-amd64/
      # linux-arm64 legs have been red for the last several commits with a
      # job duration (well under a minute) consistent with failing this
      # early, not partway through a real build. The unversioned
      # libc++-dev/libc++abi-dev package names track whatever version the
      # unversioned clang package defaults to on a given Ubuntu release,
      # so this needs no explicit version pin here. --no-install-recommends
      # is kept and still safe: it only skips Recommends-level packages,
      # not the hard Depends (the actual libc++1/libc++abi1/libunwind
      # runtime .so files) apt resolves for these -dev packages
      # regardless. ----
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld ninja-build cmake libc++-dev libc++abi-dev
          clang --version
          clang++ --version
          ld.lld --version
          cmake --version
          ninja --version

      # ---- macOS: Xcode CLT already provides clang; only cmake/ninja
      # need installing (or upgrading past whatever the image ships). ----
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ninja cmake
          clang --version
          clang++ --version
          cmake --version
          ninja --version

      # ---- Windows: this project builds with clang/lld-link but still
      # needs the Windows SDK import libraries (kernel32.lib,
      # synchronization.lib) that only a Visual Studio developer
      # environment reliably exposes -- see README.md's Windows
      # prerequisites section. ilammy/msvc-dev-cmd sets that up for the
      # requested architecture (x64 or arm64). ----
      - name: Set up MSVC developer environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      # LLVM's own official installers are architecture-specific
      # (win64 = x64 host, woa64 = arm64/"Windows on Arm" host) and are
      # fetched directly from the latest GitHub release rather than
      # through a package manager, since chocolatey/winget LLVM package
      # availability for the arm64 host case is not reliably native.
      #
      # Authenticated with the auto-provided GITHUB_TOKEN (needs no repo
      # secret setup): unauthenticated GitHub API calls are capped at 60
      # requests/hour per source IP, which Actions runners can share and
      # exhaust; authenticated calls get 1000/hour and stopped failing
      # this step outright on the very second CI run.
      #
      # Real, found CI break (2026-08-29): upstream switched the Windows
      # installer format from a `.exe` NSIS installer (every release
      # through 21.1.0) to a `.msi` package starting with 23.1.0 -- this
      # is a real llvm-project release-asset change, confirmed directly
      # against both releases' own asset lists via the GitHub API, not
      # assumed. `LLVM-*-win64.exe`/`LLVM-*-woa64.exe` simply no longer
      # exist in a current "latest" release, so the old pattern always
      # matched nothing. Matches either extension now (still correct
      # against an older pinned release, should this script ever target
      # one) and picks the right silent-install invocation for whichever
      # one the release actually shipped: `/S` for the old NSIS `.exe`,
      # `msiexec /i ... /quiet /qn` for the new `.msi`.
      - name: Install LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; "User-Agent" = "crt-ci" }
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/llvm/llvm-project/releases/latest" -Headers $headers
          $asset = $release.assets | Where-Object {
            $_.name -like "LLVM-*-${{ matrix.llvm_asset }}.msi" -or $_.name -like "LLVM-*-${{ matrix.llvm_asset }}.exe"
          } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find an LLVM '${{ matrix.llvm_asset }}' installer asset (.msi or .exe) in release $($release.tag_name)"
          }
          Write-Host "Installing $($asset.name) from $($release.tag_name)"
          $ext = [System.IO.Path]::GetExtension($asset.name)
          $installer = Join-Path $env:RUNNER_TEMP "llvm-installer$ext"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $installer
          if ($ext -eq ".msi") {
            Start-Process -FilePath "msiexec.exe" -ArgumentList "/i", "`"$installer`"", "/quiet", "/qn", "/norestart" -Wait
          } else {
            Start-Process -FilePath $installer -ArgumentList "/S" -Wait
          }
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            throw "Expected LLVM install at '$llvmBin' but it does not exist"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $llvmBin

      - name: Verify toolchain (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          clang --version
          clang++ --version
          lld-link --version
          cmake --version
          ninja --version

      - name: Configure, build, and test
        run: cmake --workflow --preset ${{ matrix.preset }}
