name: Host tools

# Assembles, packs, verifies and natively replays the independent CRT host-tools bundle for each Linux host from the pinned
# public Dev SDK Preview (.github/ci/host-tools-sdk-pins.json). Manual only: a bundle release is a deliberate, versioned act.
# It publishes nothing; the artifacts are reviewed, then released by a maintainer. A rehearsal with a dirty tree is impossible
# here (the checkout is clean), so a green run is a release-candidate result for exactly this commit.

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Release date in the version, yyyymmdd'
        required: true
        type: string
      revision:
        description: 'Revision number in the version'
        required: true
        default: '1'
        type: string

permissions:
  contents: read

concurrency:
  group: host-tools-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: bundle (${{ matrix.host }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-26.04
          - host: linux-aarch64
            runner: ubuntu-26.04-arm
    steps:
      - name: Check out the producer commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Unit tests of the assembler, release tooling and driver
        run: python -m unittest tools.test_host_tools tools.test_host_tools_release tools.test_ci_host_tools_release

      - name: Install bubblewrap for the isolated replay
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          # Ubuntu restricts unprivileged user namespaces by default; the replay needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --ro-bind / / true

      - name: Assemble, pack, verify and replay the bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python tools/ci_host_tools_release.py
          --date "${{ inputs.date }}" --revision "${{ inputs.revision }}"
          --work "$RUNNER_TEMP/host-tools"

      - name: Keep the release candidate and its evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: host-tools-${{ matrix.host }}
          path: |
            ${{ runner.temp }}/host-tools/release/*
            ${{ runner.temp }}/host-tools/replay/host-tools-replay.json
          if-no-files-found: warn
