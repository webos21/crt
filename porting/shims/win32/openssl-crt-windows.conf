## OpenSSL build targets for the CRT on Windows (x86_64 and aarch64).
##
## The CRT's Windows ABI is LLP64: `long` is 32 bits. OpenSSL's linux-* targets say
## SIXTY_FOUR_BIT_LONG (BN_ULONG is `unsigned long`) and so build 32-bit bignum words that
## are counted as 64-bit ones ("bignum too long" at the first EC key). These targets are the
## Linux ones with BN_ULONG as `unsigned long long`, which is what upstream's mingw64 target
## does; nothing else of the Windows targets is wanted (no Win32 API, no resource files).
my %targets = (
    "crt-windows-x86_64" => {
        inherit_from => [ "linux-x86_64" ],
        bn_ops       => "SIXTY_FOUR_BIT RC4_CHAR",
    },
    "crt-windows-aarch64" => {
        inherit_from => [ "linux-aarch64" ],
        bn_ops       => "SIXTY_FOUR_BIT RC4_CHAR",
    },
);
